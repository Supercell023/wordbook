name: CI

# 触发：推送到 main / master、所有 Pull Request、手动运行。
# 不安装 Android SDK：APK 由本地 android/build.sh 产出并提交时才上传。
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: tests/package-lock.json

      - name: 安装 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/requirements.txt

      - name: 安装构建依赖（pyphen / nltk）
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyphen nltk

      - name: 下载 NLTK WordNet
        run: python -m nltk.downloader wordnet omw-1.4

      - name: 获取 ECDICT 词库
        run: bash tools/fetch_data.sh

      - name: 安装测试依赖
        working-directory: tests
        run: |
          if [ -f package-lock.json ]; then
            npm ci --registry=https://registry.npmmirror.com
          else
            npm install --registry=https://registry.npmmirror.com
          fi

      - name: 构建词库
        run: python3 tools/build.py

      - name: 同步 PWA 资源
        run: bash build.sh sync

      - name: 校验 PWA 资源
        run: bash build.sh verify

      - name: 运行前端测试
        run: node tests/test.js

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: wordbook-build
          path: |
            dist/vocab.html
            android/wordbook.apk
          if-no-files-found: ignore
          retention-days: 14
