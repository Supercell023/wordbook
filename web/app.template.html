<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
:root{
  --serif:"Times New Roman","Songti SC","STSong","SimSun","Noto Serif CJK SC","Noto Serif SC","Source Han Serif SC","Liberation Serif",Georgia,serif;
  --bg:#f4efe4;--card:#fffdf7;--ink:#211c15;--sub:#746b5c;--line:#e3dac8;

  --shadow:0 18px 38px -22px rgba(60,45,25,.4);
}
html[data-theme=dark]{
  --bg:#0e1117;--card:#161b23;--ink:#ece6d8;--sub:#9a958a;--line:#29303c;
  --accent:#9fb4d9;--accent-2:#d3b483;--ok:#63c79a;--bad:#e77e8a;--gold:#e8be66;
  --cta1:#3b5a8c;--cta2:#5d7fae;--chip:#1d232d;

}
body{background:var(--bg);color:var(--ink);font-family:var(--serif);overscroll-behavior:none;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
.app{max-width:520px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top,0px) + 16px) 18px calc(env(safe-area-inset-bottom,0px) + 18px)}
.hd{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:18px}
.eyebrow{font-size:11px;letter-spacing:.16em;color:var(--sub);font-weight:600}
h1{font-size:30px;margin:4px 0 0;letter-spacing:-.02em;font-weight:800}
.icon{width:40px;height:40px;border-radius:14px;background:var(--card);box-shadow:var(--shadow);
  display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--sub)}
.card{background:var(--card);border-radius:22px;box-shadow:var(--shadow);padding:18px}
.hero{display:flex;flex-direction:column;gap:2px;margin-bottom:10px}

.hero .num small{font-size:15px;color:var(--sub);font-weight:600;letter-spacing:0}
.hero .lb{font-size:13px;color:var(--sub)}
.hero .sub{font-size:12px;color:var(--sub);margin-top:8px}
.bar{height:6px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:10px}

.chips{display:flex;flex-wrap:wrap;gap:7px;padding:14px 2px 12px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:9px 15px;border-radius:99px;font-size:13px;font-weight:600;
  color:var(--sub);background:var(--card);border:1px solid var(--line);white-space:nowrap;transition:.15s}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.cta{width:100%;min-height:60px;border-radius:20px;padding:0 20px;display:flex;align-items:center;
  justify-content:space-between;gap:10px;font-size:17px;font-weight:700;color:#fff;
  background:linear-gradient(135deg,#3b5bfd,#6a4bff);box-shadow:0 14px 28px -14px rgba(59,91,253,.9);
  transition:transform .08s}
.cta:active{transform:scale(.985)}
.cta small{font-size:12px;font-weight:600;opacity:.85}
.cta.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line);box-shadow:none;min-height:52px;font-size:15px}
.cta.done{background:var(--card);color:var(--sub);box-shadow:none;justify-content:center;font-size:15px}
.actions{display:flex;flex-direction:column;gap:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.mini{display:flex;flex-direction:column;gap:3px;align-items:flex-start;padding:16px;text-align:left}
.mini .em{font-size:18px}
.mini b{font-size:14px;font-weight:700}
.mini span{font-size:12px;color:var(--sub)}
.mini:active{transform:scale(.985)}
.mini.off{opacity:.45}
.note{margin-top:auto;padding-top:14px;text-align:center;font-size:11px;color:var(--sub);opacity:.8;line-height:1.7}
.topbar{display:flex;align-items:center;gap:12px;margin-bottom:14px;height:36px}

.tbtn{width:36px;height:36px;border-radius:12px;background:var(--card);box-shadow:var(--shadow);

.pvlist{flex:1;display:flex;flex-direction:column;gap:8px;overflow-y:auto;padding-bottom:14px}
.pvrow{background:var(--card);border-radius:16px;padding:12px 14px;display:flex;gap:12px;align-items:flex-start}
.pvrow .ix{font-size:11px;color:var(--sub);width:18px;padding-top:3px;text-align:right;flex:0 0 auto}
.pvrow .en{font-size:17px;font-weight:700;letter-spacing:-.01em}
.pvrow .ph{font-size:12px;color:var(--sub);font-weight:500;margin-left:5px}
.pvrow .zh{font-size:13px;color:var(--sub);margin-top:3px;line-height:1.5}
.pvrow .tags{display:flex;gap:4px;margin-top:5px;flex-wrap:wrap}
.pvrow .main{flex:1;min-width:0}
.pvrow .ex{display:none;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);font-size:12.5px;color:var(--sub);line-height:1.55}
.pvrow .ex .cn{color:var(--sub);opacity:.9}
.pvrow.open .ex{display:block}
.pvrow .more{margin-top:5px;font-size:11px;color:var(--accent);font-weight:600}
.pvrow.open .more{display:none}
.spk{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;

  vertical-align:middle;margin-left:6px}
.spk:active{transform:scale(.9)}
.qex{margin-top:16px;padding-top:13px;border-top:1px dashed var(--line);text-align:left;max-width:100%}
.qex .en{font-size:14.5px;line-height:1.5;color:var(--ink)}
.qex .cn{font-size:13px;line-height:1.55;color:var(--sub);margin-top:5px}
.qex .none{font-size:12px;color:var(--sub);opacity:.7}
.syl{font-size:12.5px;color:var(--sub);margin-top:2px;letter-spacing:.03em}
.qsyl{font-size:13px;color:var(--sub);letter-spacing:.06em;margin-top:-2px}
.fam{margin-top:6px;font-size:12px;color:var(--sub)}
.fam i,.qfam i{font-style:normal;opacity:.6;margin-left:2px}
.qfam{margin-top:4px;font-size:13px;color:var(--sub)}
.qfam b{color:var(--accent);font-weight:600}
.tg{font-size:10px;padding:1px 6px;border-radius:5px;background:var(--line);color:var(--sub);font-weight:600}
.starb{border:0;background:none;padding:2px 4px;font-size:17px;line-height:1;color:#c9cfdb;cursor:pointer;flex:none}
.starb.on{color:#f5b942}
.pvrow .tags .starb{margin-left:auto;font-size:15px;align-self:center}
.tbtn.starb{background:var(--card);box-shadow:var(--shadow);font-size:18px}
.streak{margin-top:6px;font-size:12px;color:var(--sub)}
.streak b{color:var(--accent)}
.qwrap{flex:1;display:flex;align-items:center;justify-content:center;padding:6px 0 14px}
.qcard{width:100%;min-height:320px;border-radius:28px;background:var(--card);box-shadow:var(--shadow);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
  padding:30px 22px;text-align:center;transition:background .18s;animation:pop .18s ease}
.qcard.ok{background:color-mix(in srgb,var(--ok) 13%,var(--card))}
.qcard.bad{background:color-mix(in srgb,var(--bad) 13%,var(--card))}
.qword{font-size:clamp(34px,10.5vw,46px);font-weight:800;letter-spacing:-.025em;line-height:1.12;word-break:break-word}
.qph{font-size:15px;color:var(--sub)}
.qzh{font-size:17px;line-height:1.6;margin-top:10px;max-width:100%}
.qhint{font-size:12px;color:var(--sub);opacity:.75;margin-top:14px}
.spellw{display:flex;flex-direction:column;gap:10px}
.spell .qzh{font-size:20px;line-height:1.6;text-align:center;padding:18px 14px}
.spell input{width:100%;box-sizing:border-box;padding:14px 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);color:var(--txt);font-size:20px;letter-spacing:.5px;text-align:center;outline:none;font-family:inherit}
.spell input:focus{border-color:var(--pri)}
.spell .res{text-align:center;font-size:14px;min-height:22px}
.spell .res.ok{color:var(--ok)}
.spell .res.bad{color:var(--bad);font-weight:600}
.qbtns{display:flex;gap:12px}
.btn{flex:1;height:62px;border-radius:20px;font-size:17px;font-weight:700;
  display:flex;align-items:center;justify-content:center;transition:transform .08s,opacity .15s}
.btn:active{transform:scale(.97)}
.btn.ok{background:var(--ok);color:#fff;box-shadow:0 12px 24px -14px var(--ok)}

.done-hero{display:flex;flex-direction:column;align-items:center;gap:6px;padding:26px 0 18px}

.stat{background:var(--card);border-radius:16px;padding:14px 10px;text-align:center;box-shadow:var(--shadow)}
.stat b{display:block;font-size:20px;font-weight:800;letter-spacing:-.02em}
.stat span{font-size:11px;color:var(--sub)}
.blist{flex:1;display:flex;flex-direction:column;gap:8px;overflow-y:auto}
.brow{background:var(--card);border-radius:16px;padding:13px 15px;display:flex;align-items:center;gap:12px}
.brow .n{font-size:13px;font-weight:800;width:52px}
.brow .info{flex:1;font-size:12px;color:var(--sub)}
.brow .info b{font-size:12px;color:var(--ink);font-weight:600;margin-right:6px}
.brow .go{color:var(--sub);font-size:12px}
.arow{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:16px;padding:12px 14px}
.arow .n{font-size:12px;font-weight:800;width:52px}
.arow .info{flex:1;font-size:12px;color:var(--sub)}
.arow .go{font-size:12px;color:var(--sub)}
.empty{text-align:center;color:var(--sub);font-size:13px;padding:40px 0;line-height:1.8}
.hrow{background:var(--card);border-radius:14px;padding:11px 13px}
.hrow .top{display:flex;justify-content:space-between;font-size:12px;color:var(--sub)}
.hrow .top b{color:var(--ink);font-size:14px}
.wlist{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.wtag{font-size:12px;padding:2px 7px;border-radius:7px;background:var(--bg);border:1px solid var(--line)}
.sheet-bg{position:fixed;inset:0;background:rgba(4,8,16,.5);z-index:60;display:flex;align-items:flex-end;
  justify-content:center;animation:fade .16s ease;backdrop-filter:blur(3px)}
.sheet{position:relative;width:100%;max-width:520px;max-height:84dvh;overflow-y:auto;background:var(--card);border-radius:26px 26px 0 0;
  padding:24px 18px calc(env(safe-area-inset-bottom,0px) + 24px);animation:up .2s ease}
.sheet h3{margin:0 0 14px;font-size:15px;font-weight:800}
.sheet .s-btn{width:100%;height:50px;border-radius:14px;background:var(--bg);font-size:15px;font-weight:600;
  display:flex;align-items:center;justify-content:center;margin-bottom:9px}
.sheet .s-btn.danger{color:var(--bad)}
.sheet .tip{font-size:11px;color:var(--sub);line-height:1.7;margin:12px 2px 0}
.srow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;font-size:13px}
.seg{display:flex;gap:6px}
.sbtn{min-width:40px;height:34px;padding:0 10px;border-radius:10px;background:var(--bg);font-size:13px;font-weight:600;color:var(--sub)}
.sbtn.on{background:var(--ink);color:var(--bg)}
.tgline{text-align:center;font-size:12px;color:var(--sub);margin:-6px 0 14px}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 84px);transform:translate(-50%,10px);
  background:rgba(15,23,42,.92);color:#fff;font-size:13px;padding:10px 16px;border-radius:12px;
  opacity:0;pointer-events:none;transition:.2s;z-index:99;max-width:80vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.985)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{transform:translateY(24px)}to{transform:none}}
.s-in{width:100%;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:0 12px;font:inherit;font-size:14px;margin-bottom:8px;outline:none}
.s-in:focus{border-color:var(--accent)}
.syncbar{display:flex;align-items:center;gap:8px;margin-top:10px;padding:12px 14px;border-radius:16px;background:var(--card);box-shadow:var(--shadow);font-size:13px;color:var(--sub);font-weight:600}
.syncbar b{color:var(--accent)}

.syncbar.dirty{color:var(--ink)}

.qbtns{gap:10px}
.btn{height:58px;border-radius:17px;font-size:16px;font-weight:600}
.btn.ok{background:linear-gradient(135deg,color-mix(in srgb,var(--ok) 88%,#000),var(--ok));box-shadow:0 14px 24px -16px var(--ok)}
.btn.bad{border:1.4px solid color-mix(in srgb,var(--bad) 70%,var(--line));color:var(--bad);background:transparent}
.spell input{height:56px;border-radius:15px;border:1.4px solid var(--line);background:var(--card);color:var(--ink);
  font-size:20px;letter-spacing:.04em;font-family:var(--serif)}
.spell input:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 12%,transparent)}
.spell .qzh{font-size:19px;text-align:center}
.spell .qcard{justify-content:center;min-height:150px}
.done-hero{padding:30px 0 20px;gap:5px}
.done-hero .em{font-size:46px;filter:drop-shadow(0 6px 12px color-mix(in srgb,var(--gold) 30%,transparent))}
.done-hero .t{font-size:21px;font-weight:700}
.done-hero .s{font-size:12.5px;color:var(--sub)}
.stats{gap:9px;margin:6px 0 14px}
.stat{border-radius:15px;padding:14px 8px;border:1px solid color-mix(in srgb,var(--line) 50%,transparent);box-shadow:none}
.stat b{font-size:21px;font-weight:700;font-variant-numeric:tabular-nums}
.stat span{font-size:10.5px;color:var(--sub)}
.blist{gap:7px}
.brow{border-radius:14px;padding:12px 13px;border:1px solid color-mix(in srgb,var(--line) 48%,transparent)}
.brow .n{font-size:13px;font-weight:700;width:auto;min-width:44px}
.brow .info{font-size:11.5px;line-height:1.5}
.arow{border-radius:14px;padding:11px 13px;border:1px solid color-mix(in srgb,var(--line) 48%,transparent)}
.hrow{border-radius:13px;border:1px solid color-mix(in srgb,var(--line) 48%,transparent)}
.wtag{border-radius:6px;font-size:11px;padding:2px 6px}
.sheet-bg{background:rgba(18,14,8,.46);backdrop-filter:blur(4px)}
.sheet{border-radius:24px 24px 0 0;padding:22px 18px calc(env(safe-area-inset-bottom,0px) + 22px);
  border-top:1px solid color-mix(in srgb,var(--line) 60%,transparent);position:relative}
.sheet h3{font-size:16px;font-weight:700;letter-spacing:.01em;margin-bottom:14px}
.sheet .s-btn{border-radius:13px;font-size:14px;font-weight:600;background:color-mix(in srgb,var(--bg) 78%,var(--card))}
.srow{font-size:12.5px;margin-bottom:11px}
.sbtn{border-radius:9px;font-size:12px;height:33px;background:color-mix(in srgb,var(--bg) 72%,var(--card))}
.sbtn.on{background:var(--ink);color:var(--bg)}
.s-in{height:43px;border-radius:11px;background:color-mix(in srgb,var(--bg) 60%,var(--card));color:var(--ink)}
.tgline{font-size:11.5px;color:var(--sub);letter-spacing:.01em}
.syncbar{border-radius:14px;box-shadow:none;border:1px solid color-mix(in srgb,var(--line) 45%,transparent)}
.toast{border-radius:11px;font-family:var(--serif);letter-spacing:.02em;background:color-mix(in srgb,var(--ink) 92%,transparent);color:var(--bg)}

/* 最近 7 天 */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:14px;align-items:end}
.week .wd{text-align:center}
.week .wd i{display:block;height:30px;display:flex;align-items:flex-end;justify-content:center}
.week .wd i b{display:block;width:9px;min-height:3px;border-radius:4px 4px 2px 2px;
  background:color-mix(in srgb,var(--line) 85%,var(--sub));transition:height .3s}
.week .wd.today i b{background:linear-gradient(180deg,var(--accent),color-mix(in srgb,var(--accent) 55%,#9db7dd))}
.week .wd span{display:block;font-size:9px;color:var(--sub);margin-top:4px;letter-spacing:0}
.week .wd.today span{color:var(--accent);font-weight:700}
.reward{display:flex;align-items:center;justify-content:center;gap:7px;font-size:11.5px;color:var(--gold);
  margin:2px 0 12px;letter-spacing:.02em}

/* 义项 */
.senses{display:flex;flex-direction:column;gap:5px;text-align:left;width:100%;margin-top:7px}
.sen{display:flex;align-items:flex-start;gap:8px;line-height:1.5}
.sen .pos{flex:0 0 auto;min-width:32px;padding:1px 6px;border-radius:5px;text-align:center;
  font-size:10px;font-weight:700;letter-spacing:.01em;color:var(--accent);
  background:color-mix(in srgb,var(--accent) 9%,transparent);border:1px solid color-mix(in srgb,var(--accent) 16%,transparent)}
.sen .mean{font-size:13px;color:var(--ink);opacity:.9;line-height:1.55;word-break:break-word}
.sen .mean em{font-style:normal}
.sen .mean .semi{color:var(--sub);margin:0 1px}
.zh .senses{gap:3px;margin-top:0}
.zh .sen{gap:6px;line-height:1.45}
.zh .sen .pos{font-size:9px;min-width:28px;padding:0 4px;background:transparent;border:0;color:var(--accent);opacity:.9}
.zh .sen .mean{font-size:12px;color:var(--sub);opacity:1}
.sep{color:var(--line);margin:0 2px}

/* 同族词 / 近反义 / 词形 */
.famline{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:10px}
.famlb{font-size:10px;color:var(--sub);letter-spacing:.08em;margin-right:1px}
.famhint{font-size:10px;color:var(--sub);opacity:.65;margin-top:5px}
.chips-wrap{display:flex;flex-wrap:wrap;gap:6px}
.famw{display:inline-flex;align-items:baseline;gap:5px;padding:5px 9px;border-radius:8px;
  background:color-mix(in srgb,var(--accent) 6%,transparent);border:1px solid color-mix(in srgb,var(--line) 65%,transparent);
  color:var(--ink);font-size:12.5px;line-height:1.2;transition:background .15s}
.famw:active{background:color-mix(in srgb,var(--accent) 14%,transparent)}
.famw .fw{font-weight:600;letter-spacing:.01em}
.famw .pos{font-size:9px;color:var(--accent);font-weight:700}
.famw.sm{font-size:11.5px;padding:3px 7px}
.rel{display:inline-flex;align-items:center;gap:4px;padding:4px 8px;border-radius:7px;font-size:12px;
  background:color-mix(in srgb,var(--line) 35%,transparent);border:1px solid transparent;color:var(--ink)}
.rel.ant{color:var(--bad);background:color-mix(in srgb,var(--bad) 7%,transparent)}
.form{display:inline-flex;align-items:baseline;gap:5px;padding:4px 8px;border-radius:7px;font-size:12px;
  background:color-mix(in srgb,var(--line) 28%,transparent)}
.form i{font-style:normal;font-size:9px;color:var(--sub);letter-spacing:.02em}
.starb.on{color:var(--gold);text-shadow:0 0 10px color-mix(in srgb,var(--gold) 40%,transparent)}

/* 词卡 */
.wc-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.wc-word{font-size:34px;font-weight:700;letter-spacing:-.02em;line-height:1.05;word-break:break-word}
.sheet-x{flex:none;width:36px;height:36px;border-radius:50%;
  background:color-mix(in srgb,var(--bg) 70%,var(--card));border:1px solid var(--line);
  color:var(--sub);font-size:13px;line-height:1}
.wc-acts .sheet-x{margin-left:2px}
.sheet-x-corner{position:absolute;top:14px;right:14px;z-index:2}
.wc-stars{margin-top:6px}
.wc-stars .stars{font-size:12px;color:var(--gold);letter-spacing:1.5px}
.more-btn{margin-top:11px;padding:7px 11px;border-radius:8px;background:transparent;
  border:1px dashed color-mix(in srgb,var(--accent) 30%,var(--line));color:var(--accent);
  font-size:11px;font-weight:600;letter-spacing:.01em}
.ex-en{line-height:1.55}
.qdef b{font-size:10px;color:var(--accent);margin-right:3px}
.wc-ph{font-size:12.5px;color:var(--sub);margin-top:5px;letter-spacing:.02em}
.wc-syl{font-size:11px;color:var(--sub);letter-spacing:.05em;margin-top:2px}
.wc-acts{display:flex;gap:6px;align-items:center;flex:none}
.wc-acts .icon{width:36px;height:36px;font-size:15px;box-shadow:none}
.wc-block{margin-top:17px;padding-top:14px;border-top:1px solid color-mix(in srgb,var(--line) 65%,transparent)}
.wc-lb{font-size:9.5px;letter-spacing:.16em;color:var(--sub);font-weight:700;margin-bottom:8px}
.wc-def{font-size:12.5px;line-height:1.55;margin:0 0 6px;color:var(--ink);opacity:.9}
.wc-def .pos{color:var(--accent);font-weight:700;font-size:10px;margin-right:5px}
.wc-en{font-size:13px;line-height:1.55;margin:0 0 6px;font-style:italic;color:var(--ink);opacity:.85}
.wc-famd{font-size:14px;line-height:1.6}
.wc-ex-en{font-size:13.5px;line-height:1.55}
.wc-ex-cn{font-size:12px;color:var(--sub);line-height:1.55;margin-top:4px}
.wc-tags{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin-top:14px}
.wc-tags .stars{font-size:11px;color:var(--gold);letter-spacing:1px;margin-right:4px}
.wc-tags .tg{font-size:9.5px}

/* 搜索 */
.searchbar{display:flex;gap:8px;margin-bottom:12px}
.searchbar input{flex:1;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);
  color:var(--ink);padding:0 13px;font-family:var(--serif);font-size:15px;outline:none}
.searchbar input:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 10%,transparent)}
.srlist{display:flex;flex-direction:column;gap:7px;overflow-y:auto;flex:1;padding-bottom:12px}
.sr{display:flex;align-items:center;gap:10px;padding:11px 13px;border-radius:13px;background:var(--card);
  border:1px solid color-mix(in srgb,var(--line) 50%,transparent);text-align:left}
.sr .sw{font-size:16px;font-weight:700;flex:none;min-width:82px}
.sr .sw .pos{font-size:9.5px;color:var(--accent);font-weight:700;margin-left:4px}
.sr .sm{font-size:11.5px;color:var(--sub);line-height:1.45;flex:1}
.sr .go{font-size:11px;color:var(--sub)}
.sr .st{color:var(--gold);font-size:11px;flex:none}

/* 完成奖励 */
.fx{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;
  background:rgba(10,8,4,.42);backdrop-filter:blur(3px);animation:fade .2s ease}
.fx canvas{position:absolute;inset:0;width:100%;height:100%}
.fx-card{position:relative;z-index:1;max-width:82vw;padding:24px 26px 22px;border-radius:24px;
  background:var(--card);border:1px solid color-mix(in srgb,var(--gold) 35%,var(--line));
  box-shadow:0 30px 70px -28px #000;text-align:center;animation:fxin .45s cubic-bezier(.2,.9,.3,1.18)}
.fx-em{font-size:46px;line-height:1}
.fx-t{font-size:18px;font-weight:700;margin-top:7px;letter-spacing:.01em}
.fx-s{font-size:11.5px;color:var(--sub);margin-top:6px;line-height:1.6}
.fx-btn{margin-top:15px;padding:9px 24px;border-radius:99px;background:var(--ink);color:var(--bg);
  font-size:13px;font-weight:600;letter-spacing:.03em}
@keyframes fxin{from{opacity:0;transform:translateY(14px) scale(.92)}to{opacity:1;transform:none}}
/* ---------- v3：预测、引导、选择练习、搜索历史 ---------- */
.updatebar{display:flex;align-items:center;gap:8px;margin:0 0 12px;padding:10px 14px;border-radius:14px;
  background:color-mix(in srgb,var(--accent) 12%,var(--card));border:1px solid color-mix(in srgb,var(--accent) 30%,var(--line));
  color:var(--accent);font-size:12.5px;font-weight:600;cursor:pointer}
.updatebar b{font-size:16px;line-height:1}
.forecast{margin-top:11px;padding-top:10px;border-top:1px dashed var(--line);font-size:11px;color:var(--sub);line-height:1.6}
.card.intro{padding:15px 16px;margin-bottom:12px;border-color:color-mix(in srgb,var(--gold) 45%,var(--line));background:color-mix(in srgb,var(--gold) 6%,var(--card))}
.intro-t{font-size:13.5px;font-weight:700;letter-spacing:.02em}
.intro-s{font-size:11.5px;color:var(--sub);line-height:1.8;margin-top:5px}
.intro-a{margin-top:9px;text-align:right}
.sh{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:0 0 12px;font-size:11px;color:var(--sub)}
.sh-lb{margin-right:2px}.sh-c{margin-left:auto;font-size:10.5px;color:var(--sub);text-decoration:underline;text-underline-offset:2px}
.sh-t{padding:5px 10px;border-radius:99px;background:color-mix(in srgb,var(--accent) 7%,var(--card));border:1px solid var(--line);color:var(--ink);font-size:11.5px}
.sheet-grab{width:38px;height:4px;border-radius:99px;background:color-mix(in srgb,var(--sub) 35%,transparent);margin:-12px auto 12px}
html.sheet-open,html.sheet-open body{overflow:hidden}
.choice-card{padding:18px 16px 16px;text-align:center}
.spk.big{width:66px;height:66px;font-size:28px;margin:8px auto 4px;display:flex;align-items:center;justify-content:center;
  border-radius:50%;background:color-mix(in srgb,var(--accent) 11%,var(--bg));color:var(--accent)}
.choice-hint{font-size:11.5px;color:var(--sub);letter-spacing:.04em;margin:6px 0 14px}
.cloze{font-family:var(--serif);font-size:22px;line-height:1.55;margin:12px 2px 6px;color:var(--ink);text-align:left}
.cloze-cn{font-size:12px;color:var(--sub);text-align:left;margin:0 2px 14px;line-height:1.6}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.opt{width:100%;min-height:48px;padding:10px 12px;border-radius:13px;border:1px solid var(--line);
  background:color-mix(in srgb,var(--bg) 55%,var(--card));color:var(--ink);font-family:var(--serif);
  font-size:15px;line-height:1.4;text-align:center;transition:background .15s,border-color .15s}
.opt:active{transform:scale(.99)}
.opt.right{background:color-mix(in srgb,var(--ok) 14%,var(--card));border-color:var(--ok)}
.opt.wrong{background:color-mix(in srgb,var(--bad) 12%,var(--card));border-color:var(--bad)}
.opt.dim{opacity:.48}
.opt:disabled{opacity:1}
.choice-fb{margin-top:12px;font-size:13px;font-weight:650}
.choice-fb.ok{color:var(--ok)}.choice-fb.bad{color:var(--bad)}
html[data-fs="lg"] .qword{font-size:50px}html[data-fs="lg"] .wc-word{font-size:30px}
html[data-fs="lg"] .opt,html[data-fs="lg"] .pvrow .en{font-size:17px}
html[data-fs="lg"] .qzh,html[data-fs="lg"] .cloze{font-size:24px}
html[data-fs="xl"] .qword{font-size:56px}html[data-fs="xl"] .wc-word{font-size:34px}
html[data-fs="xl"] .opt,html[data-fs="xl"] .pvrow .en{font-size:19px}
html[data-fs="xl"] .qzh,html[data-fs="xl"] .cloze{font-size:27px}
html[data-contrast="high"]{--sub:#445064;--line:#aeb9ca}
html[data-theme="dark"][data-contrast="high"]{--sub:#c9d3e1;--line:#40506a}
@media (max-width:360px){
  .grid2{gap:8px}.choice-card{padding:14px 12px 12px}.cloze{font-size:20px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
}
@media (max-width:360px){
  h1{font-size:30px}.hero .num{font-size:38px}.qword{font-size:33px}
  .app{padding-left:14px;padding-right:14px}
}

/* 词库选择：首页只展示常用项，其余在设置里开启 */
.chips-note{font-size:12px;color:var(--sub);margin:-4px 2px 10px;display:flex;gap:6px;align-items:center}
.chips-note button{border:0;background:none;color:var(--accent);font:inherit;padding:2px 0;cursor:pointer}
.libpick{display:flex;flex-wrap:wrap;gap:6px}
.lbtn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:7px 11px;font:inherit;font-size:12px;cursor:pointer}
.lbtn.on{background:var(--accent);border-color:var(--accent);color:#fff}
html[data-theme="dark"] .lbtn.on{color:#0e1117}

.rangepick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.rbtn{padding:9px 4px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit;font-size:13px;cursor:pointer}
.rbtn.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
html[data-theme=dark] .rbtn{background:#171c27;border-color:#2a3242;color:#e7e2d6}
html[data-theme=dark] .rbtn.on{background:var(--accent);border-color:var(--accent);color:#fff}

<body>
<div id="app" class="app"></div>
<div id="toast" class="toast"></div>
<script>
"use strict";
const RAW = __WORDS__;
const FAMD = __FAMD__;

/* ---------- 数据 ---------- */
const trOf = s => (s || []).map(([p, items]) => (p ? p + ' ' : '') + items.join('，')).join(' / ');
const WORDS = RAW.map((r, i) => {
  const senses = r[8] || [];
  return {
    id: i, w: r[0], ph: r[1] || '', mask: r[2], d: r[3], f: r[4],
    ex: r[5] || null, syl: r[6] || null, fam: r[7] || null,
    senses, spec: r[9] || [], defs: r[10] || [], forms: r[11] || [],
    stars: r[12] || 0, syn: r[13] || [], ant: r[14] || [],
    tr: trOf(senses).slice(0, 160) || (FAMD[String(r[0]).toLowerCase()] || '')
  };
});
const WORD_BY = Object.create(null);
WORDS.forEach(w => { WORD_BY[w.w.toLowerCase()] = w; });
const N = WORDS.length;
function lookupWord(key) {
  if (key === undefined || key === null || key === '') return null;
  if (typeof key === 'number') return WORDS[key] || null;
  const s = String(key);
  if (/^\d+$/.test(s)) return WORDS[Number(s)] || null;
  const w = WORD_BY[s.toLowerCase()];
  if (w) return w;
  const meaning = FAMD[s.toLowerCase()];
  if (meaning) return { w: s, ph: '', senses: [], spec: [], defs: [], forms: [], stars: 0, syn: [], ant: [], fam: null, famd: meaning, tr: meaning };
  return null;
}
function senseBlock(w, opt) {
  opt = opt || {};
  const max = opt.max || 99, mi = opt.maxItems || 99;
  const rows = (w.senses || []).slice(0, max).map(([p, items]) => {
    const its = items.slice(0, mi);
    const more = items.length > mi ? '<span class="semi">；</span><em>…</em>' : '';
    const body = its.map((x, i) => `<em>${esc(x)}</em>${i < its.length - 1 ? '<span class="semi">；</span>' : ''}`).join('');
    return `<div class="sen">${p ? `<span class="pos">${esc(p)}</span>` : ''}<span class="mean">${body}${more}</span></div>`;
  });
  return rows.length ? `<div class="senses">${rows.join('')}</div>` : '';
}
function famChips(w, cls) {
  return (w.fam || []).map(f => `<button class="famw ${cls || ''}" data-act="wordCard" data-id="${esc(f[0])}"><span class="fw">${esc(f[0])}</span>${f[1] ? `<span class="pos">${esc(f[1])}</span>` : ''}</button>`).join('');
}
function relChips(arr, cls) {
  return (arr || []).map(x => `<button class="rel ${cls || ''}" data-act="wordCard" data-id="${esc(x)}">${esc(x)}</button>`).join('');
}
function formChips(arr) {
  return (arr || []).map(f => `<span class="form"><i>${esc(f[0])}</i>${esc(f[1])}</span>`).join('');
}
function starRow(n) {
  const k = Math.max(0, Math.min(5, n | 0));
  return k ? `<span class="stars">${'★'.repeat(k)}${'☆'.repeat(5 - k)}</span>` : '';
}

const RANGES = [
  { k: 0, n: '全部' }, { k: 1, n: '中考' }, { k: 2, n: '高考' }, { k: 4, n: '四级' }, { k: 8, n: '六级' },
  { k: 256, n: '考研' }, { k: 512, n: '专四' }, { k: 1024, n: '专八' }, { k: 2048, n: 'CATTI' },
  { k: 16, n: '雅思' }, { k: 32, n: '托福' }, { k: 64, n: '沪中考' }, { k: 128, n: '沪高考' }
];
const RANGE_NAME = k => (RANGES.find(r => r.k === k) || RANGES[0]).n;
const POOLS = {};
RANGES.forEach(r => {
  POOLS[r.k] = r.k === 0 ? WORDS.map(w => w.id) : WORDS.filter(w => (w.mask & r.k)).map(w => w.id);
});
const TAG_DEF = [{ b: 1, n: '中考' }, { b: 2, n: '高考' }, { b: 4, n: '四级' }, { b: 8, n: '六级' },
  { b: 256, n: '考研' }, { b: 512, n: '专四' }, { b: 1024, n: '专八' }, { b: 2048, n: 'CATTI' },
  { b: 16, n: '雅思' }, { b: 32, n: '托福' }, { b: 64, n: '沪中考' }, { b: 128, n: '沪高考' }];

/* ---------- 发音 ---------- */
const NATIVE_TTS = !!(window.AndroidTTS && typeof window.AndroidTTS.speak === 'function');
const WEB_TTS = 'speechSynthesis' in window;
const TTS = NATIVE_TTS || WEB_TTS;
const HD_OK = typeof Audio === 'function' && !/jsdom/i.test(navigator.userAgent || '');

/* ---------- 分组（难度分层） ---------- */
function stratPick(ids, k) {
  if (k >= ids.length) return ids.slice();
  const byD = ids.slice().sort((a, b) => WORDS[a].d - WORDS[b].d);
  const out = [];
  for (let i = 0; i < k; i++) {
    const a = Math.floor(i * byD.length / k);
    const b = Math.max(a + 1, Math.floor((i + 1) * byD.length / k));
    const seg = byD.slice(a, b);
    // 层内优先常用词（词频数值越小越常见）
    const cand = seg.slice().sort((x, y) => WORDS[x].f - WORDS[y].f).slice(0, Math.max(1, Math.ceil(seg.length * 0.4)));
    out.push(cand[Math.floor(Math.random() * cand.length)]);
  }
  return out;
}

  const pool = ids.slice(), out = [];
  const c = 0.42 + 0.33 * Math.min(1, S.seq / 15), s2 = 2 * 0.20 * 0.20;
  while (out.length < k && pool.length) {
    let total = 0;
    const w = pool.map(id => { const dd = WORDS[id].d - c; return Math.exp(-dd * dd / s2) + 0.02; });
    for (const x of w) total += x;
    let r = Math.random() * total, i = 0;
    for (; i < pool.length; i++) { r -= w[i]; if (r <= 0) break; }
    if (i >= pool.length) i = pool.length - 1;

}

  const out = hot.slice(0, Math.min(hot.length, Math.max(2, Math.round(n * 0.4))));

}

/* ---------- 答题 ---------- */
function answer(ok) {
  const s = cur();

  const id = s.queue[0];
  s.taps++;
  s.attempts[id] = (s.attempts[id] || 0) + 1;
  if (ok) {
    s.queue.shift();
    if (s.kind === 'learn' && s.mastered.indexOf(id) < 0) s.mastered.push(id);
  } else {
    // 不熟：直接跳到下一个词，本词放到本组最后，本组结束时再考一次
    s.fail++;
    markWrong(id, 'recall');
    s.queue.shift();
    s.queue.push(id);
  }
  s.peek = false;
  s.act = Date.now();
  s.fb = { ok: !!ok, lock: true };
  save(); render();
  buzz(ok ? 8 : [0, 18, 40, 18]);
  clearTimeout(fbTimer);
  fbTimer = setTimeout(() => {
    const s2 = cur();
    if (!s2) return;
    s2.fb = null;
    if (!s2.queue.length) finish();
    else { save(); render(); }
  }, 220);
}
function recycle(ids) {
  let n = 0;
  ids.forEach(id => {
    const r = S.learned[id];
    if (r && r.ok !== false && r.w >= S.cfg.recycleAt) { r.ok = false; n++; }
  });
  return n;
}
function finish() {
  const s = cur();
  if (!s) return;
  const now = Date.now(), wrong = [];
  s.ids.forEach(id => {
    const a = s.attempts[id] || 0;
    const rec = S.learned[id] || (S.learned[id] = { w: 0, r: 0, t: 0, ok: true });
    const add = Math.max(0, a - 1);
    rec.w += s.kind === 'learn' ? Math.min(1, add) : Math.min(2, add);
    rec.r += 1; rec.t = now; rec.ok = true;
    if (a > 1) wrong.push(id);
  });
  const first = s.ids.filter(id => (s.attempts[id] || 0) === 1).length;
  const dur = Math.round((now - s.start) / 1000);
  s.ids.forEach(id => {
    const r = S.learned[id];
    if (!r) return;
    const wrongWord = (s.attempts[id] || 1) > 1;
    srsUpdate(r, wrongWord, now);
  });
  const before = todayCount();
  bumpDaily(s.ids.length);
  const after = todayCount(), goal = S.cfg.goal || 20;
  let fxKind = '';
  if (before < goal && after >= goal && S.fxDay !== todayKey()) {
    S.fxDay = todayKey(); fxKind = 'goal';
  } else if (s.kind === 'due' && s.ids.length >= 5 && dueIds().length === 0 && S.fxDay !== todayKey()) {
    S.fxDay = todayKey(); fxKind = 'due';
  }
  let autoStars = 0;
  if (S.cfg.autoStar) wrong.forEach(id => { if (!S.star[id]) { S.star[id] = now; autoStars++; } });
  const hrec = { ts: now, first, total: s.ids.length, taps: s.taps, dur, wrong, kind: s.kind, mode: s.mode || '' };
  if (s.kind === 'learn') {
    S.groups.push({ id: s.gno, range: s.range, ts: now, ids: s.ids.slice(), hist: [hrec] });
  } else if (s.kind === 'group') {
    const g = S.groups.find(x => x.id === s.groupId);
    if (g) {
      g.hist.push(hrec);
      if (g.hist.length > S.cfg.maxHist) g.hist = g.hist.slice(-S.cfg.maxHist);
    }
  }
  const recycled = s.kind === 'learn' ? 0 : recycle(wrong);
  S.lastDone = {
    kind: s.kind, mode: s.mode || '', total: s.ids.length, first, taps: s.taps, dur,
    group: s.kind === 'learn' ? s.gno : s.groupId,
    wrong: wrong.length, recycled, stars: autoStars,
    today: todayCount(), goal: S.cfg.goal || 20, streak: streakDays()
  };
  S.actives = S.actives.filter(a => a.sid !== s.sid);
  S.cur = null;
  save(); go('done');
  if (fxKind) setTimeout(() => celebrate(fxKind), 280);
}

/* ---------- 听音选义 / 例句填空 / 错题本 ---------- */
const TYPE_CN = { recall: '认词', listen: '听音', cloze: '填空', spell: '拼写' };
function blankCloze(w) {
  if (!w || !w.ex || !w.ex[0]) return '';
  const word = w.w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const re = new RegExp('\\b' + word + '(?:s|es|ed|d|ing)?\\b', 'i');
  return re.test(w.ex[0]) ? w.ex[0].replace(re, '____') : '';
}
function choiceDistractors(w, mode, right) {
  const out = [], seen = new Set([String(right).toLowerCase()]);
  let tries = 0;
  while (out.length < 3 && tries++ < 400) {
    const x = WORDS[Math.floor(Math.random() * WORDS.length)];
    if (!x || x.id === w.id) continue;
    const t = mode === 'cloze' ? x.w : (x.senses && x.senses[0] && x.senses[0][1] && x.senses[0][1][0]);
    if (!t || seen.has(String(t).toLowerCase())) continue;
    seen.add(String(t).toLowerCase()); out.push(String(t));
  }
  while (out.length < 3) out.push('—');
  return out;
}
function prepareChoice(s) {
  if (!s || !s.queue.length) return;
  const id = s.queue[0];
  if (s.ch && String(s.ch.id) === String(id)) return;
  const w = WORDS[id];
  let mode = s.mode === 'cloze' ? 'cloze' : 'listen';
  let right = '', sent = '';
  if (mode === 'cloze') {
    sent = blankCloze(w);
    if (!sent) mode = 'listen';
    else right = w.w;
  }
  if (mode === 'listen') right = (w.senses && w.senses[0] && w.senses[0][1] && w.senses[0][1][0]) || w.tr || w.w;
  const opts = choiceDistractors(w, mode, right);
  const ans = Math.floor(Math.random() * (opts.length + 1));
  opts.splice(ans, 0, right);
  s.ch = { id, mode, opts, ans, picked: null, sent };
}
function startChoice(mode) {
  let ids = rangeLearnedIds().filter(id => WORDS[id]);
  if (mode === 'cloze') ids = ids.filter(id => blankCloze(WORDS[id]));
  if (ids.length < 2) return toast(mode === 'cloze' ? '带例句的已学词还不够，先学一组吧' : '先学几个单词再练');
  ensureSlot();
  const s = newSession('choice', shuffle(ids.slice()).slice(0, 20), { range: S.range, seen: true, mode });
  S.actives.push(s); S.cur = s.sid; save(); go('choice');
}

function searchList(q) {

  const pre = [], mid = [];
  for (let i = 0; i < WORDS.length; i++) {
    const w = WORDS[i], lw = w.w.toLowerCase();
    if (lw === q) { pre.unshift(w); continue; }

function runFx(g, canvas, style) {
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const W = window.innerWidth, H = window.innerHeight;
  canvas.width = W * dpr; canvas.height = H * dpr;
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  const pal = ['#c8963e', '#d95d74', '#3b5bd8', '#2f9d7c', '#8b6bd8', '#f0c96a'];
  const rnd = (a, b) => a + Math.random() * (b - a);
  let parts = [];
  if (style === 'confetti') {
    for (let i = 0; i < 150; i++) parts.push({ x: rnd(0, W), y: rnd(-H, 0), vx: rnd(-.6, .6), vy: rnd(1.4, 3.4), r: rnd(2, 5), a: rnd(0, 6.28), va: rnd(-.15, .15), c: pal[i % pal.length], t: 'rect' });
  } else if (style === 'stars') {
    for (let i = 0; i < 80; i++) { const a = rnd(0, 6.28), sp = rnd(2, 8); parts.push({ x: W / 2, y: H * .42, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, r: rnd(5, 13), life: rnd(55, 100), max: 100, c: pal[i % pal.length], t: 'star' }); }
  } else if (style === 'petals') {
    for (let i = 0; i < 90; i++) parts.push({ x: rnd(0, W), y: rnd(-H, 0), vx: rnd(-.5, .5), vy: rnd(.8, 2.2), r: rnd(3, 7), a: rnd(0, 6.28), va: rnd(-.04, .04), sway: rnd(.4, 1.4), ph: rnd(0, 6.28), c: pal[i % pal.length], t: 'petal' });
  } else {
    for (let b = 0; b < 5; b++) {
      const cx = rnd(W * .18, W * .82), cy = rnd(H * .16, H * .55), n = 46;
      for (let i = 0; i < n; i++) { const a = i / n * 6.28 + rnd(-.05, .05), sp = rnd(1.5, 5.5); parts.push({ x: cx, y: cy, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, r: rnd(1.4, 3), life: rnd(60, 100), max: 100, c: pal[(b + i) % pal.length], t: 'spark' }); }
    }
  }
  let last = performance.now();
  function tick(t) {
    const dt = Math.min(2.2, (t - last) / 16.67); last = t;
    g.clearRect(0, 0, W, H);
    let alive = 0;
    parts.forEach(p => {
      if (p.life !== undefined && p.life <= 0) return;
      alive++;
      p.x += p.vx * dt; p.y += p.vy * dt;
      if (p.t === 'rect') { p.vy += .03 * dt; p.a += p.va * dt; p.vx *= .997; }
      else if (p.t === 'star') { p.vy += .03 * dt; p.vx *= .985; p.vy *= .985; p.life -= dt; }
      else if (p.t === 'petal') { p.ph += .04 * dt; p.x += Math.sin(p.ph) * p.sway * dt; p.a += p.va * dt; p.vx *= .999; }
      else { p.vy += .045 * dt; p.vx *= .985; p.vy *= .985; p.life -= dt; }
      const alpha = p.life !== undefined ? Math.max(0, Math.min(1, p.life / 30)) : 1;
      g.globalAlpha = alpha; g.fillStyle = p.c;
      if (p.t === 'star') {
        g.save(); g.translate(p.x, p.y); g.rotate(p.a || 0);
        g.font = `${p.r}px serif`; g.fillText('✦', -p.r / 2, p.r / 2); g.restore();
      } else if (p.t === 'petal') {
        g.save(); g.translate(p.x, p.y); g.rotate(p.a); g.beginPath();
        g.ellipse(0, 0, p.r, p.r * .55, 0, 0, 6.28); g.fill(); g.restore();
      } else if (p.t === 'spark') {
        g.beginPath(); g.arc(p.x, p.y, p.r, 0, 6.28); g.fill();
      } else {
        g.save(); g.translate(p.x, p.y); g.rotate(p.a); g.fillRect(-p.r, -p.r * .45, p.r * 2, p.r * .9); g.restore();
      }
    });
    g.globalAlpha = 1;
    if (alive && t < 9000) requestAnimationFrame(tick); else g.clearRect(0, 0, W, H);
  }
  requestAnimationFrame(tick);
}



/* ---------- 老师端同步 ---------- */
const escA = s => String(s == null ? '' : s);
function digestOf() {
  const parts = [];
  Object.keys(S.learned).sort().forEach(k => { const r = S.learned[k]; parts.push(k + ':' + r.w + ':' + (r.ok ? 1 : 0) + ':' + r.t); });
  const gs = S.groups.map(g => g.id + ':' + g.ids.length + ':' + g.hist.map(h => h.first + '/' + (h.wrong || []).length).join('.'));
  const str = S.seq + '|' + parts.join(',') + '|' + gs.join(',');
  let h = 0x811c9dc5;
  for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 0x01000193); }

function pushData() {
  const groups = S.groups.map(g => {
    const wrong = {};

    return { gno: g.id, range: g.range, first: g.hist.length ? g.hist[0].first : null, total: g.ids.length,
      wrong: Object.entries(wrong).map(([w, n]) => ({ w, n })), hist: g.hist };
  });
  const recent = [];
  S.groups.forEach(g => (g.hist || []).forEach(h => {
    recent.push({ ts: h.ts || 0, first: h.first, total: h.total || (g.ids || []).length, dur: h.dur || 0,
      wrong: (h.wrong || []).length, kind: h.kind || '', mode: h.mode || '', gno: g.id });
  }));
  recent.sort((a, b) => b.ts - a.ts);
  const dayKeys = Object.keys(S.days || {}).sort().slice(-30), days = {};
  dayKeys.forEach(k => { if ((S.days[k] || 0) > 0) days[k] = S.days[k]; });
  const minutes = Math.round(S.groups.reduce((a, g) => a + g.hist.reduce((b, h) => b + (h.dur || 0), 0), 0) / 60);
  return { seq: S.seq, learned: Object.keys(S.learned).length, groups, minutes, cfg: { range: S.range, diff: S.cfg.diff },
    days, streak: streakDays(), goal: S.cfg.goal || 20, today: todayCount(), due: dueIds().length,
    wrongN: wrongIds().length, stars: Object.keys(S.star || {}).length, sessions: recent.slice(0, 30) };
}

function syncBase() { return (S.sync.url || '').trim().replace(/\/+$/, ''); }

}

    const blob = new Blob([JSON.stringify(S)], { type: 'application/json' });
    const a = document.createElement('a');
    const d = new Date();
    a.href = URL.createObjectURL(blob);
    a.download = `wordbook-backup-${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 3000);
    toast('备份已导出');
  } catch (e) { toast('导出失败：' + e.message); }
}
function doImport() {
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = 'application/json,.json';
  inp.onchange = () => {
    const f = inp.files && inp.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      try {
        const d = JSON.parse(String(r.result));
        if (!d || typeof d !== 'object' || !('learned' in d)) throw new Error('格式不对');
        S = migrate(d);
        S.cfg = Object.assign(defaults().cfg, d.cfg || {});
        save(); applyTheme(); closeModal(false); go('home'); toast('已导入备份');
      } catch (e) { toast('导入失败：' + e.message); }
    };
    r.readAsText(f);
  };
  inp.click();
}

/* ---------- 启动 ---------- */
S = loadState() || defaults();
S.cfg = Object.assign(defaults().cfg, S.cfg || {});
S.sync = Object.assign(defaults().sync, S.sync || {});
if (!S.sync.url && /^https?:\/\//.test(location.origin)) S.sync.url = location.origin;
S.learned = S.learned || {}; S.groups = S.groups || []; S.actives = S.actives || [];
S.days = S.days || {}; S.star = S.star || {};
S.wrong = S.wrong || {}; S.searchHist = S.searchHist || [];
if (!S.actives.some(a => a.sid === S.cur)) S.cur = null;
S.actives.forEach(a => { if (!a.queue) a.queue = a.ids.slice(); a.fb = null; a.peek = false; });
applyTheme(); applyDisplay();
try {
  if (window.matchMedia) matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
    if ((S.cfg.theme || 'auto') === 'auto') { applyTheme(); render(); }
  });
} catch (e) {}
render();
document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });
window.addEventListener('pagehide', save);

/* ---------- PWA（iOS/安卓 添加到主屏幕后离线可用） ---------- */
if ((location.protocol === 'http:' || location.protocol === 'https:') && 'serviceWorker' in navigator && !NATIVE_TTS) {
  const markUpdate = () => {
    if (updateReady) return;
    updateReady = true;
    if (view === 'home') render();
    toast('新版本已就绪，点顶部提示刷新');
  };
  navigator.serviceWorker.addEventListener('message', e => {
    if (e.data && e.data.type === 'WB_UPDATED') markUpdate();
  });
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').then(reg => {
      if (reg.waiting && navigator.serviceWorker.controller) markUpdate();
      reg.addEventListener('updatefound', () => {
        const nw = reg.installing;
        if (!nw) return;
        nw.addEventListener('statechange', () => {
          if (nw.state === 'installed' && navigator.serviceWorker.controller) markUpdate();
        });
      });
    }).catch(() => {});
  });
}
</script>
